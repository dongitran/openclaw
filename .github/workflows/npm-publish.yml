name: NPM Publish

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
      - ".agents/**"
      - "skills/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual publish)"
        required: false
        type: boolean
        default: true

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false # Don't cancel in-progress publishes

jobs:
  # Step 1: Type checking, lint, and format validation
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check types and lint and oxfmt
        run: pnpm check

  # Step 2: Secret scanning
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          python -m pip install detect-secrets==1.5.0

      - name: Detect secrets
        run: |
          if ! detect-secrets scan --baseline .secrets.baseline; then
            echo "::error::Secret scanning failed. See docs/gateway/security.md#secret-scanning-detect-secrets"
            exit 1
          fi

  # Step 3: Run tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run tests
        run: pnpm canvas:a2ui:bundle && pnpm test

  # Step 4: Build and validate package
  build-and-validate:
    needs: [check, secrets, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build package
        run: pnpm build

      - name: Validate package contents (release:check)
        run: pnpm release:check

      - name: Pack package (dry run)
        run: npm pack --dry-run

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7

  # Step 5: Publish to npm using Trusted Publisher (OIDC)
  publish:
    needs: [build-and-validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !inputs.dry_run
    permissions:
      id-token: write # Required for OIDC authentication with npm
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: "24.x" # Node 24.x or later recommended for Trusted Publishing
          registry-url: "https://registry.npmjs.org" # Required for OIDC

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/

      - name: Publish to npm (with automatic provenance)
        run: npm publish --access public --ignore-scripts
        # --ignore-scripts: Skip prepack lifecycle hook since dist is already built
        # Note: No --provenance flag needed - automatically generated with Trusted Publishing
        # No NPM_TOKEN needed - authentication via OIDC

      - name: Verify published package
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Verifying $PACKAGE_NAME@$PACKAGE_VERSION"
          sleep 10  # Wait for npm registry to propagate
          npm view $PACKAGE_NAME@$PACKAGE_VERSION
